<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Brankas Digital</title>

    <link rel="stylesheet"
          href="style.css">
</head>

<body>

    <div class="container">

        <div class="safe">

            <h1>🔐 BRANKAS DIGITAL</h1>

            <p class="subtitle">
                Masukkan kode keamanan untuk membuka brankas
            </p>

            <div class="lock"
                 id="lock">
                🔒
            </div>

            <div class="status"
                 id="status">
                TERKUNCI
            </div>

            <input
                type="password"
                id="kode"
                maxlength="6"
                inputmode="numeric"
                placeholder="••••••"
            >

            <button onclick="bukaBrankas()">
                BUKA BRANKAS
            </button>

            <p id="pesan"></p>

        </div>

    </div>

    <script>

        async function cekStatus() {

            try {

                const response =
                    await fetch("/status");

                const data =
                    await response.json();

                document.getElementById("status")
                    .textContent = data.status;

            } catch (error) {

                document.getElementById("status")
                    .textContent = "SERVER ERROR";
            }
        }


        async function bukaBrankas() {

            const kode =
                document.getElementById("kode")
                    .value;

            const pesan =
                document.getElementById("pesan");

            const status =
                document.getElementById("status");

            const lock =
                document.getElementById("lock");


            if (!/^\d{6}$/.test(kode)) {

                pesan.textContent =
                    "Kode harus terdiri dari 6 angka.";

                return;
            }


            pesan.textContent =
                "Memeriksa kode...";


            try {

                const response =
                    await fetch(
                        "/buka?kode=" +
                        encodeURIComponent(kode)
                    );

                const data =
                    await response.json();


                if (data.berhasil) {

                    status.textContent =
                        "TERBUKA";

                    lock.textContent =
                        "🔓";

                    pesan.textContent =
                        "Brankas berhasil dibuka.";

                } else {

                    status.textContent =
                        "TERKUNCI";

                    lock.textContent =
                        "🔒";

                    pesan.textContent =
                        "Kode salah.";
                }


            } catch (error) {

                pesan.textContent =
                    "Server tidak dapat dihubungi.";
            }
        }


        document
            .getElementById("kode")
            .addEventListener(
                "keypress",
                function(event) {

                    if (event.key === "Enter") {
                        bukaBrankas();
                    }

                }
            );


        cekStatus();

    </script>

</body>

</html>
